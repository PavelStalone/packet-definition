name: 'Prepare Release'

on:
  # Allows this workflow to be triggered manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release (e.g., 1.0.0)'
        required: true

jobs:
  prepare-release:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Checks out the 'main' branch to get the latest changes
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: 'main'

      # Creates a new release branch from the 'main' branch
      - name: Create release branch from main
        run: |
          git checkout -b "release/${{ github.event.inputs.version }}"

      # Updates version numbers in Gradle Build files and docs
      - name: Update version in build files and docs
        run: |
          VERSION=${{ github.event.inputs.version }}
          sed -i "s/^packetDefinitionVersion=.*/packetDefinitionVersion=$VERSION/" gradle.properties
          sed -i "s/io.github.pavelstalone:packet-definition:.*\"/io.github.pavelstalone:packet-definition:$VERSION\"/g" README.md

      # Commits the version changes and pushes the new release branch
      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Prepare packet-definition release ${{ github.event.inputs.version }}"
          git push -u origin "release/${{ github.event.inputs.version }}"

      # Creates a pull request from the release branch to the main branch
      - name: Create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base "main" --head "release/${{ github.event.inputs.version }}" --title "Prepare packet-definition release ${{ github.event.inputs.version }}" --body "This PR is preparing the release of a new version of the packet-definition library ${{ github.event.inputs.version }}" --reviewer "${{ github.actor }}"
